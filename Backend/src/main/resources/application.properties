# PERFORMANCE y OPTIMIZATION
server.tomcat.max-connections=8192
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=20000

# JACKSON JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Santiago
spring.jackson.default-property-inclusion=NON_NULL

# VALIDATION y ERROR HANDLING
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.include-stacktrace=on-param
server.error.include-message=always

# PROFILE CONFIGURATION
spring.profiles.active=dev

# LOGGING CONFIGURATION
# Nivel de log general (INFO para producción, DEBUG para desarrollo)
logging.level.root=INFO
logging.level.com.message=DEBUG

# Archivo de salida (Esto creará el archivo automáticamente)
logging.file.name=logs/registro_sistema.log

# Formato del Log en Archivo: [FECHA HORA] [NIVEL] [Descripcion]
logging.pattern.file=[%d{yyyy-MM-dd HH:mm:ss}] [%-5level] %msg%n

# Formato opcional para la consola (para que lo veas mientras programas)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n